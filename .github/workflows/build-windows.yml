name: Build WinGuard for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build WinGuard Agent
    runs-on: windows-latest

    steps:
      - name: Checkout WinGuard
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WinGuardAgent.sln

      - name: Publish WinGuard Agent
        shell: pwsh
        run: >-
          dotnet publish .\WinGuardAgent\WinGuardAgent.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -o .\publish\Agent

      - name: Create package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path .\package -Force | Out-Null
          Copy-Item .\publish\Agent\WinGuardAgent.exe .\package\WinGuardAgent.exe -Force
          Copy-Item .\README.md .\package\README.md -Force
          @'
          WinGuard Agent - Windows x64

          This build currently contains the WinGuard background service/CLI.
          The separate WinGuardAdmin project is not yet present in this repository,
          so the workflow intentionally does not try to build it.
          '@ | Set-Content .\package\INSTALL.txt -Encoding UTF8

      - name: Upload WinGuard Agent
        uses: actions/upload-artifact@v4
        with:
          name: WinGuard-Agent
          path: package/
          if-no-files-found: error
          retention-days: 30
